    <span class="kicker">HIBORN / PROJECT ATLAS</span><h1>项目位置索引</h1><p class="lead">从全国项目分布，到西安落点，再到单个项目位置。地图点位对应公开小区地标，宗地红线以正式资料核定。</p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
  (function(){
    'use strict';
    var projects=[
      {id:'heyuan',name:'曲江公馆·和园',kind:'高文安老师项目',summary:'大尺度空间、玻璃构造与精细收口的协同落地。',photos:7,lat:34.2076896,lng:108.9859586,source:'https://www.openstreetmap.org/search?query='+encodeURIComponent('曲江公馆和园 西安')},
      {id:'source',name:'源邸壹号 · 260㎡',kind:'住宅项目',summary:'原香港 CCD 合伙人刘力硕老师项目。',photos:1,address:'西安浐灞国际港，浐河西路北段 6888 号／欧亚大道附近',source:'https://www.fang.com/xiaoqu/xian-3610191674/'},
      {id:'tanfu',name:'泰发祥·檀府 · 330㎡',kind:'无间设计吴滨老师项目',summary:'样板间实景，关注设计意图与现场工艺的一致性。',photos:1,lat:34.2099502,lng:108.9575103,source:'https://www.openstreetmap.org/search?query='+encodeURIComponent('泰发祥檀府 西安')},
      {id:'changanxi',name:'航天城招商长安玺',kind:'高端住宅',summary:'项目案例与住宅施工管理。',photos:6,address:'西安航天基地，航腾路与航新路交叉口南侧',source:'https://xian.esf.fang.com/loupan/3610192470/housedetail.htm'},
      {id:'yuexi',name:'曲江华润悦玺',kind:'高端住宅',summary:'曲江片区住宅项目。',photos:5,lat:34.1979614,lng:108.9473532,source:'https://www.openstreetmap.org/search?query='+encodeURIComponent('曲江华润悦玺 西安')},
      {id:'jintai',name:'金泰唐618',kind:'高端住宅',summary:'雁塔片区住宅项目。',photos:5,address:'西安雁塔区，雁翔路以东；西影路与新安路附近',source:'https://www.sxjthy.com/project?id=28'},
      {id:'fenghua',name:'沣华熙城',kind:'高端住宅',summary:'沣东片区项目。',photos:5,lat:34.2582085,lng:108.7737943,source:'https://www.openstreetmap.org/search?query='+encodeURIComponent('沣华熙城 西安')},
      {id:'huazhu',name:'曲江华著中城',kind:'高端住宅',summary:'曲江片区住宅项目。',photos:6,lat:34.2170095,lng:108.9954461,source:'https://www.openstreetmap.org/search?query='+encodeURIComponent('曲江华著中城 西安')},
      {id:'rongmin',name:'高新荣民捌号',kind:'高端住宅',summary:'高新片区住宅项目。',photos:6,lat:34.2290295,lng:108.8691626,source:'https://www.openstreetmap.org/search?query='+encodeURIComponent('荣民捌号 西安')}
    ];
    var stage='china',selected='',map=null,layer=null,projectMarkers={},boundaryGroup=null,drawControl=null;
    var boundaryKey='hiborn-atlas-boundaries-v1';
    var $=function(sel){return document.querySelector(sel)};
    var esc=function(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
    var mapped=function(){return projects.filter(function(p){return Number.isFinite(p.lat)&&Number.isFinite(p.lng)})};
    var current=function(){return projects.find(function(p){return p.id===selected})};
    var loc=function(p){return p.address||(p.lat?'西安市 · '+p.name+'（公开小区地标）':'西安市 · '+(p.kind||'项目地址待核对'))};
    var amap=function(p){return 'https://uri.amap.com/search?'+new URLSearchParams({keyword:p.address||p.name,city:'西安',view:'map',src:'hiborn-project-atlas'})};
    function saved(){try{return JSON.parse(localStorage.getItem(boundaryKey)||'{}')}catch(_){return {}}}
    function render(){
      var p=current(),crumb=$('#crumbs'),intro=$('#intro'),side=$('#side');
      crumb.innerHTML='<button data-stage="china" class="'+(stage==='china'?'active':'')+'">中国</button><span>／</span><button data-stage="city" class="'+(stage==='city'?'active':'')+'" '+(stage==='china'?'disabled':'')+'>西安</button><span>／</span><button class="'+(stage==='detail'?'active':'')+'" disabled>'+(stage==='detail'&&p?esc(p.name):'项目位置')+'</button>';
      if(stage==='china'){
        intro.innerHTML='<span class="eyebrow">NATIONAL OVERVIEW</span><h2>中国项目分布</h2><p>项目案例当前集中在陕西西安。将鼠标移至发光点查看项目概况，点击进入西安项目地图。</p><div class="stats"><b>'+projects.length+'</b><span>项目档案</span><b>'+mapped().length+'</b><span>已核对公开地标</span></div><p class="source-note">项目坐标为公开小区级位置索引，不代表楼栋、住宅单元或施工宗地。在线地图需要网络连接。</p>';
        side.innerHTML='<span class="eyebrow">XI’AN / '+projects.length+' PROJECTS</span><h3>西安项目集群</h3><p>点地图上的西安标记进入城市视图；再选择单个项目查看位置详情。</p><div class="project-list">'+projects.map(function(x,i){return '<button class="project '+(x.lat?'':'pending')+'" data-project="'+x.id+'"><span class="dot">'+(x.lat?'●':'＋')+'</span><span><b>'+esc(x.name)+'</b><small>'+esc(x.lat?'公开小区地标 · '+x.photos+' 张案例照片':loc(x)+' · 待核实坐标')+'</small></span><span>↗</span></button>'}).join('')+'</div>';
        $('#map-caption').textContent='中国项目分布 · 发光点代表西安';
      }else if(stage==='city'){
        intro.innerHTML='<span class="eyebrow">CITY OVERVIEW</span><h2>西安项目地图</h2><p>点位落在公开地图可核对的小区地标上。悬停查看项目摘要，点击查看单项位置和地块资料。</p><div class="stats"><b>'+projects.length+'</b><span>项目档案</span><b>'+mapped().length+'</b><span>已定位地标</span></div><p class="source-note">其他项目在右侧保留名称与地址；地址搜索结果尚未人工确认前，不放置地图标记。</p>';
        side.innerHTML='<span class="eyebrow">PROJECT INDEX</span><h3>西安 · '+projects.length+' 个项目</h3><p class="hint">点击项目查看位置详情。无坐标项可打开地图检索并核对。</p><div class="project-list">'+projects.map(function(x,i){return '<button class="project '+(x.lat?'':'pending')+'" data-project="'+x.id+'"><span class="dot">'+(x.lat?'●':'＋')+'</span><span><b>'+esc(x.name)+'</b><small>'+esc(x.lat?'公开小区地标 · '+x.photos+' 张照片':loc(x)+' · 坐标待确认')+'</small></span><span>↗</span></button>'}).join('')+'</div>';
        $('#map-caption').textContent='西安 · '+mapped().length+' 个公开小区地标 / '+projects.length+' 个项目档案';
      }else{
        var has=!!saved()[selected],latText=p&&Number.isFinite(p.lat)?p.lat.toFixed(6)+'°N, '+p.lng.toFixed(6)+'°E':'准确坐标待核实';
        intro.innerHTML='<span class="eyebrow">PROJECT LOCATION</span><h2>'+esc(p?p.name:'项目位置')+'</h2><p>'+esc(p?p.summary:'项目地址资料待补充。')+'</p><div class="stats"><b>'+((p&&p.photos)||0)+'</b><span>案例照片</span><b>'+(p&&p.lat?'已核对':'待确认')+'</b><span>地图坐标</span></div><p class="source-note">项目地标代表公开小区位置。宗地轮廓需要项目方提供或确认的红线图、总平坐标后再录入。</p>';
        side.innerHTML='<span class="eyebrow">PROJECT / '+(p&&p.lat?'LOCATION':'ADDRESS')+'</span><h3>'+esc(p?p.name:'项目')+'</h3><p>'+esc(p?p.summary:'')+'</p><div class="detail-grid"><div class="detail-row"><span>公开位置</span><span>'+esc(p?loc(p):'待补充')+'</span></div><div class="detail-row"><span>地图坐标</span><span>'+esc(latText)+'</span></div><div class="detail-row"><span>宗地轮廓</span><span>'+(has?'已在本机浏览器绘制':'待正式红线资料')+'</span></div></div><p class="notice">'+(has?'轮廓保存在当前浏览器，仍须与项目正式红线核对。':'当前没有经项目方确认的宗地边界，地图标记仅表示小区公开地标。')+'</p><div class="actions"><a href="'+esc(amap(p||{}))+'" target="_blank" rel="noopener">高德检索 ↗</a><a href="'+esc(p&&p.source||'#')+'" target="_blank" rel="noopener">位置来源 ↗</a><button id="draw-boundary" '+(p&&p.lat?'':'disabled')+'>'+(has?'重绘轮廓':'绘制轮廓')+'</button></div>';
        $('#map-caption').textContent=(p?p.name:'项目位置')+' · '+(p&&p.lat?'公开地标坐标':'地图落点待核实');
      }
    }
    function popup(p){return '<div class="popup-title">'+esc(p.name)+'</div><div class="popup-meta">'+esc(p.kind)+'<br>'+esc(p.summary)+'<br>'+p.photos+' 张案例照片 · 点击查看位置</div>'}
    function clearLayers(){if(layer){layer.remove();layer=null}projectMarkers={};if(boundaryGroup){boundaryGroup.remove();boundaryGroup=null}}
    function icon(html){return L.divIcon({className:'',html:html,iconSize:null,iconAnchor:[10,10]})}
    function enterCity(){stage='city';selected='';render();syncMap()}
    function enterDetail(id){stage='detail';selected=id;render();syncMap()}
    function syncMap(){
      if(!map)return;clearLayers();
      if(stage==='china'){
        map.setView([35.9,104.2],4,{animate:true});
        var china=L.marker([34.3416,108.9398],{icon:icon('<div class="pulse-icon"></div>'),keyboard:true,title:'西安 · '+projects.length+' 个项目'}).addTo(map);
        china.bindTooltip('<div class="popup-title">西安 · '+projects.length+' 个项目</div><div class="popup-meta">'+mapped().length+' 个公开小区地标已核对<br>案例：'+projects.slice(0,3).map(function(p){return esc(p.name)}).join(' · ')+' 等<br>点击进入西安项目地图</div>',{direction:'top',offset:[0,-10],opacity:1,sticky:true});
        china.on('click',enterCity);
        layer=L.layerGroup([china]).addTo(map);
      }else if(stage==='city'){
        map.setView([34.22,108.91],10,{animate:true});layer=L.layerGroup().addTo(map);
        mapped().forEach(function(p){var mark=L.marker([p.lat,p.lng],{icon:icon('<div class="project-icon"></div>'),title:p.name,keyboard:true}).addTo(layer);mark.bindTooltip(popup(p),{direction:'top',offset:[0,-8],sticky:true});mark.on('click',function(){enterDetail(p.id)});projectMarkers[p.id]=mark});
        var group=L.featureGroup(Object.values(projectMarkers));if(Object.keys(projectMarkers).length)map.fitBounds(group.getBounds().pad(.18),{maxZoom:11,animate:true});
      }else{
        var p=current();if(p&&p.lat){map.setView([p.lat,p.lng],16,{animate:true});layer=L.layerGroup().addTo(map);var mark=L.marker([p.lat,p.lng],{icon:icon('<div class="project-icon selected"></div>'),title:p.name}).addTo(layer);mark.bindTooltip(p.name,{permanent:true,direction:'top',offset:[0,-8],className:'map-label'});mark.bindPopup(popup(p));projectMarkers[p.id]=mark}else{map.setView([34.3416,108.9398],12,{animate:true});layer=L.layerGroup().addTo(map)}
        boundaryGroup=L.featureGroup().addTo(map);var savedData=saved()[selected];if(savedData&&savedData.type==='FeatureCollection')L.geoJSON(savedData,{style:{color:'#e4bd76',weight:3,fillColor:'#d9b875',fillOpacity:.18}}).eachLayer(function(l){boundaryGroup.addLayer(l)});
      }
      var loading=$('#loading');if(loading)loading.remove();
    }
    function hoverProject(id){var p=projects.find(function(x){return x.id===id});if(!p)return;if(stage==='city'&&projectMarkers[id])projectMarkers[id].openTooltip();else if(stage==='china'){map.closeTooltip();L.tooltip({direction:'top',sticky:true}).setLatLng([34.3416,108.9398]).setContent(popup(p)).openOn(map)}}
    document.addEventListener('click',function(e){var s=e.target.closest('[data-stage]'),p=e.target.closest('[data-project]');if(s){stage=s.dataset.stage;if(stage!=='detail')selected='';render();syncMap();return}if(p){enterDetail(p.dataset.project);return}if(e.target.closest('#draw-boundary')){if(!window.L.Draw){alert('边界绘制工具加载失败，请刷新后重试。');return}if(!drawControl){drawControl=new L.Control.Draw({draw:{polyline:false,rectangle:false,circle:false,circlemarker:false,marker:false,polygon:{allowIntersection:false,showArea:true,shapeOptions:{color:'#e4bd76',weight:3,fillColor:'#d9b875',fillOpacity:.18}}},edit:{featureGroup:boundaryGroup}});map.addControl(drawControl)}return}});
    document.addEventListener('mouseover',function(e){var p=e.target.closest('[data-project]');if(p)hoverProject(p.dataset.project)});
    document.addEventListener('mouseout',function(e){var p=e.target.closest('[data-project]');if(p&&stage==='china')map.closeTooltip()});
    if(!window.L){$('#loading').textContent='在线地图组件加载失败；请检查网络后刷新。';return}
    map=L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([35.9,104.2],4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'}).addTo(map);
    if(L.Draw)map.on(L.Draw.Event.CREATED,function(e){boundaryGroup.clearLayers();boundaryGroup.addLayer(e.layer);var all=saved();all[selected]=e.layer.toGeoJSON();localStorage.setItem(boundaryKey,JSON.stringify(all));render();syncMap()});
    render();syncMap();
  })();
  </script>
</body>
</html>
