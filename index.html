</style><style>/* Two intentionally complete themes: readable paper and restrained graphite. */
:root{color-scheme:dark;--theme-border:#ffffff16;--theme-soft:#ffffff09;--theme-control:#101319;--theme-selected:#303844;--theme-highlight:#c3d7e9}
html[data-theme="light"]{color-scheme:light;--bg:#f5f5f3;--surface:#ffffff;--line:#25334224;--ink:#20262d;--muted:#515e6b;--accent:#364e63;--theme-border:#28354226;--theme-soft:#26344109;--theme-control:#e8ebed;--theme-selected:#fff;--theme-highlight:#364e63}

(function () {
  'use strict';
  var KEY = 'hiborn-flow-theme';
  var palettes = {
    dark: {
      bg: '#090b0f', bg2: '#15191f',
      node1: '#333942', node2: '#20252d', node3: '#141920',
      line: '#4f5e70', lineStrong: '#8d9fb3',
      ink: '#edf1f6', muted: '#a7b3c2', subtle: '#7d8a9b',
      accent: '#c3d7e9', dot: '#f3f8ff', shadow: '#000000', loop: '#a3b2c5'
    },
    light: {
      bg: '#f5f5f3', bg2: '#e9ebed',
      node1: '#ffffff', node2: '#f2f3f4', node3: '#e7eaed',
      line: '#8b95a0', lineStrong: '#526373',
      ink: '#20262d', muted: '#515e6b', subtle: '#626e7b',
      accent: '#364e63', dot: '#273e52', shadow: '#adb6bf', loop: '#5c6c7d'
    }
  };
  var theme = 'dark';
  try {
    if (localStorage.getItem(KEY) === 'light') theme = 'light';
  } catch (_) { /* Private browsing and file:// may block storage. */ }

  function palette(requestedTheme) {
    var chosen = requestedTheme === 'dark' || requestedTheme === 'light' ? requestedTheme : theme;
    return Object.assign({}, palettes[chosen]);
  }
  function updateControls() {
    ['dark', 'light'].forEach(function (name) {
      var button = document.getElementById(name + 'Theme');
      if (button) {
        button.setAttribute('aria-pressed', String(name === theme));
        button.setAttribute('aria-label', name === 'dark' ? '切换深色背景' : '切换浅色背景');
        button.title = name === 'dark' ? '深色 · 沉浸展示' : '浅色 · 清晰阅读';
      }
    });
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', palette().bg);
  }
  function set(value) {
    if (value !== 'dark' && value !== 'light') return theme;
    var changed = theme !== value;
    theme = value;
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem(KEY, theme); } catch (_) {}
    updateControls();
    if (changed) {
      window.dispatchEvent(new CustomEvent('hbthemechange', { detail: { theme: theme, palette: palette() } }));
    }
    return theme;
  }

  window.HBTheme = { get: function () { return theme; }, set: set, palette: palette };
  document.documentElement.dataset.theme = theme;
  function init() {
    ['dark', 'light'].forEach(function (name) {
      var button = document.getElementById(name + 'Theme');
      if (button) button.addEventListener('click', function () { set(name); });
    });
    updateControls();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
  else init();
}());

for(let i=0;i<6;i++){const a=xs[i]+79,b=xs[i+1]-79;const id='stage-wire-'+i;content+=routePath(id,`M${a} ${ys[i]} C${a+22} ${ys[i]} ${b-22} ${ys[i+1]} ${b} ${ys[i+1]}`,'',i===selected||i+1===selected);animateIds.push({id});}
FLOW.forEach((f,i)=>{content+=node(i,xs[i],ys[i]);content+=`<text x="${xs[i]}" y="${ys[i]+86}" text-anchor="middle" class="graph-label" style="font-size:9px;letter-spacing:0">${esc(f.caption)}</text>`});
content+=core(720,404);content+='<text x="720" y="479" text-anchor="middle" class="graph-label">专业协同 / 预算控制 / 节点确认 / 过程追踪</text>';
}else{
const f=FLOW[selected],n=f.groups.length,ys=f.groups.map((_,i)=>n===1?245:85+i*(345/(n-1)));
content+=`<text x="52" y="37" class="graph-label">0${selected+1} / ${f.en} / ${esc(f.full||f.name)}</text><text x="1386" y="37" text-anchor="end" class="graph-label">工作分支 · 点击分支查看下方明细</text>`;
f.groups.forEach((g,i)=>{const y=ys[i],a='branch-'+i,b='result-'+i;content+=routePath(a,`M325 253 C460 253 460 ${y} 582 ${y}`,'',true);content+=routePath(b,`M918 ${y} C1030 ${y} 1020 253 1120 253`,'governance');animateIds.push({id:a},{id:b,govern:true})});
content+=node(selected,246,253);
f.groups.forEach((g,i)=>{const y=ys[i];let name=g.name.split(' · ')[0];content+=`<g class="node branch-node" data-group="${i}" role="button" tabindex="0" aria-label="查看${esc(name)}"><rect class="metal" x="582" y="${y-28}" width="336" height="56" rx="10"/><circle class="port" cx="582" cy="${y}" r="2"/><circle class="port" cx="918" cy="${y}" r="2"/><text class="branch-label" x="601" y="${y+5}">${esc(name)}</text><text class="branch-count" x="901" y="${y+4}" text-anchor="end">${String(g.items.length).padStart(2,'0')}</text></g>`});
content+=`<rect x="1120" y="209" width="228" height="88" rx="13" fill="url(#coreMetal)" stroke="#ffffff24"/><text x="1234" y="245" text-anchor="middle" class="node-title">阶段结果汇总</text><text x="1234" y="272" text-anchor="middle" class="core-sub">专业协调 · 核对与交接</text><text x="720" y="487" text-anchor="middle" class="graph-label">分支表示工作分类；具体顺序、并列关系与整改回路详见下方明细</text>`;
}
content+='<g id="particles">'+animateIds.map((p,i)=>`<circle data-path="${p.id}" data-index="${i}" data-govern="${p.govern?1:0}" class="flow-dot" r="${p.govern?1.25:1.9}" opacity="0"/>`).join('')+'</g>';
svg.innerHTML=content;paths=[...svg.querySelectorAll('[data-path]')].map((dot,i)=>{const p=document.getElementById(dot.dataset.path);return {dot,p,len:p.getTotalLength(),offset:(i*.213)%1,govern:dot.dataset.govern==='1'}});
svg.querySelectorAll('[data-stage]').forEach(g=>{const act=()=>selectStage(+g.dataset.stage);g.onclick=act;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}});
svg.querySelectorAll('[data-group]').forEach(g=>{const act=()=>{const i=+g.dataset.group;document.querySelectorAll('.group-card').forEach(c=>c.classList.toggle('selected',c.id==='group-'+i));$('#group-'+i).scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'});};g.onclick=act;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}});
$('#viewHint').textContent=mode==='overview'?(innerWidth<1000?'左右滑动查看全程 · 点击阶段展开内容':'点击阶段，查看工作内容与业主参与节点'):'点击工作分支，定位下方详细内容';
drawParticles();
}
function drawParticles(){paths.forEach(({dot,p,len,offset,govern})=>{const pos=(phase/(govern?8:3.5)+offset)%1;const pt=p.getPointAtLength(pos*len);dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);dot.setAttribute('opacity',Math.min(1,pos*10,(1-pos)*10)*(govern?.58:.98))})}
function tick(now){if(lastFrame&&running&&!document.hidden)phase+=(now-lastFrame)/1000*speed;lastFrame=now;if(running&&!document.hidden)drawParticles();raf=requestAnimationFrame(tick)}
function stopTour(){if(tour){clearInterval(tour);tour=null;$('#tourBtn').textContent='▷ 逐阶段演示'}}
function selectStage(i,fromTour=false){if(!fromTour)stopTour();selected=Math.max(0,Math.min(6,i));selectedMilestone=null;updateDetail();renderGraph();$('#announcement').textContent='当前阶段：'+FLOW[selected].name;}
function updateDetail(){const f=FLOW[selected];$('#detailEyebrow').textContent=`0${selected+1} / ${f.en} / ${f.full||f.name}`;$('#detailTitle').textContent=f.title;$('#detailSummary').textContent=f.summary;$('#budgetLabel').textContent=f.budget;$('#resultText').textContent=f.result;
$('#stageNav').innerHTML=FLOW.map((f,i)=>`<button class="${i===selected?'active':''}" data-stage-nav="${i}" ${i===selected?'aria-current="step"':''}><span>0${i+1}</span>${f.name}</button>`).join('');document.querySelectorAll('[data-stage-nav]').forEach(b=>b.onclick=()=>selectStage(+b.dataset.stageNav));
$('#groupList').innerHTML=f.groups.map((g,i)=>`<article class="group-card" id="group-${i}"><div class="group-card-head"><h3>${esc(g.name)}</h3><span class="group-kind">${g.kind==='sequence'?'SEQUENCE ↓':'PARALLEL'}</span></div><${g.kind==='sequence'?'ol':'ul'}>${g.items.map(t=>'<li>'+esc(t)+'</li>').join('')}</${g.kind==='sequence'?'ol':'ul'}>${g.loop?'<p class="loop-note">↶ '+esc(g.loop)+'</p>':''}</article>`).join('')+(f.note?'<p class="group-note">'+esc(f.note)+'</p>':'');
$('#milestoneNav').innerHTML=MILESTONES.map(m=>`<button class="milestone ${m.stage===selected?'in-stage':''}" data-milestone="${m.id}" aria-label="节点${m.id}：${m.title}">${String(m.id).padStart(2,'0')}</button>`).join('');document.querySelectorAll('[data-milestone]').forEach(b=>b.onclick=()=>{const id=+b.dataset.milestone,m=MILESTONES.find(m=>m.id===id);selectStage(m.stage);selectedMilestone=id;document.querySelectorAll('[data-milestone]').forEach(x=>x.classList.toggle('selected',+x.dataset.milestone===id));$('#milestoneHint').textContent=m.title+' · '+m.desc;$('#announcement').textContent=m.title+'，'+m.desc});
const own=MILESTONES.filter(m=>m.stage===selected);$('#milestoneHint').textContent=own.length?'本阶段参与：'+own.map(m=>String(m.id).padStart(2,'0')+' '+m.title).join(' / '):'本阶段聚焦专业协同，重要验收时刻见编号节点。';
$('#nextStage').textContent=selected===6?'回到第一阶段 ↺':'下一阶段 →';}
function setMode(m){mode=m;$('#allGraphBtn').setAttribute('aria-pressed',mode==='all');$('#overviewBtn').setAttribute('aria-pressed',mode==='overview');$('#focusBtn').setAttribute('aria-pressed',mode==='focus');renderGraph();$('#canvasWrap').scrollLeft=0;}
function updateMotion(){$('#motionBtn').textContent=running?'Ⅱ 暂停光点':'▷ 播放光点';$('#motionBtn').setAttribute('aria-pressed',String(running));$('#signalLabel').textContent=running?'协同流动':'动态已暂停';lastFrame=0}
$('#allGraphBtn').onclick=()=>setMode('all');$('#overviewBtn').onclick=()=>setMode('overview');$('#focusBtn').onclick=()=>setMode('focus');$('#motionBtn').onclick=()=>{running=!running;updateMotion()};$('#speedSelect').onchange=e=>{speed=Number(e.target.value)};$('#nextStage').onclick=()=>selectStage((selected+1)%7);
$('#tourBtn').onclick=()=>{if(tour){stopTour();return}selectStage(0,true);mode='focus';setMode('focus');running=true;updateMotion();$('#tourBtn').textContent='■ 停止演示';tour=setInterval(()=>{if(selected>=6){stopTour();return}selectStage(selected+1,true)},5000)};
$('#allToggle').onclick=()=>{const open=$('#allContent').hidden;$('#allContent').hidden=!open;$('#allToggle').setAttribute('aria-expanded',String(open));$('#allSymbol').textContent=open?'−':'＋';if(open&&!$('#allContent').innerHTML)$('#allContent').innerHTML=FLOW.map((f,i)=>`<article class="all-stage"><div><div class="eyebrow">0${i+1} / ${f.en}</div><h3>${f.full||f.name}</h3><p class="small">${f.budget}</p></div><div class="all-groups">${f.groups.map(g=>`<div><h4>${esc(g.name)}</h4><p>${g.items.map(esc).join(g.kind==='sequence'?' → ':' / ')}</p>${g.loop?'<p class="small">↶ '+esc(g.loop)+'</p>':''}</div>`).join('')}${f.note?'<p>'+esc(f.note)+'</p>':''}</div></article>`).join('')};
$('.brand').onclick=e=>{e.preventDefault();selectStage(0);setMode('all');window.scrollTo({top:0,behavior:reduced?'auto':'smooth'})};
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),3500)}
function breakLines(t,max){const lines=[];let s='';for(const c of t){if(s.length>=max){lines.push(s);s=''}s+=c}if(s)lines.push(s);return lines}
$('#exportBtn').onclick=exportPoster;$('#brandLogo').src=LOGO;wireMapControls();updateDetail();renderGraph();updateMotion();raf=requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{lastFrame=0});
</script></body></html>
